name: CI

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest ../tests -q --tb=line

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lean4_path: lean
          build_args: ""

  papers-grep-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paper B vacuity supersession guard
        run: |
          B=papers/B-certified-synthesis/main.tex
          if grep -qi vacuous "$B"; then
            grep -qiE 'superseded|Paper~E|Paper E|C56|Horn covering' "$B"
          fi
