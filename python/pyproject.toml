[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "topospine"
version = "0.1.0"
description = "Certificate-carrying cubical/simplicial synthesis and cover solvers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["topospine*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
